[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-clientes-ecommerce"
version = "1.0.0"
description = "Pipeline reproducible para analizar clientes, mix de compra y operacion e-commerce con Olist."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Alexander Huth"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "plotly==6.9.0",
    "pyarrow==24.0.0",
    "requests==2.34.2",
]

[project.scripts]
ecommerce-clientes = "ecommerce_clientes.pipeline:main"

[project.urls]
Repository = "https://github.com/alexanderhuth98/analytics-clientes-ecommerce"
Documentation = "https://github.com/alexanderhuth98/analytics-clientes-ecommerce/tree/main/docs"
Issues = "https://github.com/alexanderhuth98/analytics-clientes-ecommerce/issues"

[project.optional-dependencies]
dev = [
    "coverage==7.16.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"

[tool.coverage.run]
branch = true
source = ["ecommerce_clientes"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
